<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,900&family=Barlow:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}html,body{width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(700px 500px at 90% 0%,rgba(31,95,191,.5),transparent 60%),radial-gradient(600px 400px at 0% 100%,rgba(122,59,184,.4),transparent 60%),linear-gradient(170deg,#0d1b2e,#0a1424);color:#fff;font-family:Barlow,sans-serif;position:relative}
.stripe{position:absolute;left:0;right:0;height:12px;background:linear-gradient(90deg,#1f5fbf 0 16%,#2e9e4f 16% 32%,#f5b700 32% 48%,#f08a00 48% 64%,#e0362c 64% 80%,#c2187a 80% 90%,#7a3bb8 90% 100%)}
.t{top:0}.b{bottom:0}
.bolt{position:absolute;right:30px;top:40px;width:330px;opacity:.12}
.wrap{position:relative;display:flex;align-items:center;gap:56px;padding:0 70px;height:100%}
.crest{width:250px;height:250px;border-radius:50%;background:#fff;padding:8px;flex:0 0 auto;box-shadow:0 0 0 8px rgba(255,255,255,.12),0 24px 60px rgba(0,0,0,.45)}
.crest img{width:100%;height:100%;border-radius:50%;display:block}
.club{font:800 26px 'Barlow Condensed';letter-spacing:.2em;text-transform:uppercase;color:#f5b700}
h1{margin-top:8px;font:italic 900 128px/.85 'Barlow Condensed';text-transform:uppercase}
h1 span{color:#f5b700}
.meta{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
.meta b{font:700 28px 'Barlow Condensed';letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:8px 16px}
.teams{margin-top:16px;display:flex;gap:10px}.teams i{width:70px;height:10px;border-radius:5px}
</style></head><body>
<div class="stripe t"></div>
<svg class="bolt" viewBox="0 0 24 24" fill="#f5b700"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
<div class="wrap">
  <div class="crest"><img src="../logo-400.png"></div>
  <div>
    <div class="club">FriendsCafè Club of Canada</div>
    <h1>Lightning <span>Cup</span></h1>
    <div class="meta"><b>Tue, Oct 27</b><b>8:45 to 10:15 pm</b><b>Comdev Soccer Dome</b></div>
    <div class="teams"><i style="background:#1f5fbf"></i><i style="background:#2e9e4f"></i><i style="background:#e0362c"></i><i style="background:#7a3bb8"></i></div>
  </div>
</div>
<div class="stripe b"></div>
</body></html>
