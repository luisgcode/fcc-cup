<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,900&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}html,body{width:1080px;height:1350px;overflow:hidden}
body{background:radial-gradient(900px 700px at 85% 5%,rgba(31,95,191,.45),transparent 60%),radial-gradient(800px 600px at 0% 100%,rgba(122,59,184,.35),transparent 60%),linear-gradient(170deg,#0d1b2e,#0a1424);color:#fff;font-family:Barlow,sans-serif;position:relative}
.pitch{position:absolute;inset:0;opacity:.06}
.bolt{position:absolute;right:40px;top:40px;width:300px;opacity:.12}
.stripe{position:absolute;left:0;right:0;height:14px;background:linear-gradient(90deg,#1f5fbf 0 16%,#2e9e4f 16% 32%,#f5b700 32% 48%,#f08a00 48% 64%,#e0362c 64% 80%,#c2187a 80% 90%,#7a3bb8 90% 100%)}
.t{top:0}.b{bottom:0}
.wrap{position:relative;padding:62px 70px 0;height:100%;display:flex;flex-direction:column}
.head{display:flex;align-items:center;gap:30px}
.crest{width:170px;height:170px;border-radius:50%;background:#fff;padding:6px;flex:0 0 auto;box-shadow:0 0 0 6px rgba(255,255,255,.12),0 20px 50px rgba(0,0,0,.4)}
.crest img{width:100%;height:100%;border-radius:50%;display:block}
.club{font:800 24px 'Barlow Condensed';letter-spacing:.2em;text-transform:uppercase;color:#f5b700}
h1{margin-top:4px;font:italic 900 118px/.86 'Barlow Condensed';text-transform:uppercase}
h1 span{color:#f5b700}
.tag{margin-top:10px;font:600 24px Barlow;color:rgba(255,255,255,.78)}
.info{margin-top:30px;display:grid;grid-template-columns:.85fr 1.15fr 1.5fr;gap:14px}
.box{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:16px 20px}
.k{font:700 15px Barlow;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.v{margin-top:4px;font:800 36px/1.02 'Barlow Condensed';text-transform:uppercase}
.prize{margin-top:24px;display:flex;align-items:center;justify-content:center;gap:26px;padding:16px 24px;border-radius:20px;background:linear-gradient(135deg,#ffd84d,#f5b700 45%,#e09a00);color:#0d1b2e;box-shadow:0 0 0 3px rgba(255,255,255,.25),0 16px 40px rgba(245,183,0,.35)}
.medal{width:74px;height:74px;flex:0 0 auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.pz-txt{text-align:center}.pz-k{font:800 22px 'Barlow Condensed';letter-spacing:.24em;text-transform:uppercase}
.pz-v{font:900 64px/0.95 'Barlow Condensed';text-transform:uppercase;font-style:italic}.pz-v b{font-weight:900}
.teams{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.team{border-radius:18px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.th{padding:14px 20px;font:900 38px/1 'Barlow Condensed';text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.th small{font:700 16px Barlow;letter-spacing:.12em;opacity:.85}
.team ol{list-style:none;padding:10px 20px 14px}
.team li{display:flex;align-items:center;gap:12px;padding:6px 0;font:600 26px Barlow}
.team li+li{border-top:1px solid rgba(255,255,255,.08)}
.team li i{font:800 18px 'Barlow Condensed';width:24px;color:rgba(255,255,255,.45);font-style:normal}
.cap{margin-left:auto;background:#f5b700;color:#0d1b2e;font:800 15px 'Barlow Condensed';letter-spacing:.1em;padding:3px 9px;border-radius:5px}
.foot{margin-top:auto;padding-bottom:46px;display:flex;justify-content:space-between;align-items:flex-end}
.live{font:800 26px 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase;color:#f5b700}
.url{font:600 26px Barlow;margin-top:2px}
.fmt{text-align:right;font:700 22px 'Barlow Condensed';letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.65);line-height:1.35}
</style></head><body>
<svg class="pitch" viewBox="0 0 1080 1350" fill="none" stroke="#fff" stroke-width="4"><rect x="40" y="40" width="1000" height="1270"/><line x1="40" y1="675" x2="1040" y2="675"/><circle cx="540" cy="675" r="150"/></svg>
<svg class="bolt" viewBox="0 0 24 24" fill="#f5b700"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
<div class="stripe t"></div>
<div class="wrap">
  <div class="head">
    <div class="crest"><img src="../logo-400.png"></div>
    <div><div class="club">FriendsCafè Club of Canada</div><h1>Lightning <span>Cup</span></h1><p class="tag">One night. Four teams. Ninety minutes of football.</p></div>
  </div>
  <div class="info">
    <div class="box"><div class="k">Date</div><div class="v">Tue, Oct 27</div></div>
    <div class="box"><div class="k">Kick off</div><div class="v">8:45 to 10:15 pm</div></div>
    <div class="box"><div class="k">Venue</div><div class="v">Comdev Soccer Dome, Cambridge</div></div>
  </div>
  <div class="prize">
    <svg class="medal" viewBox="0 0 64 64" aria-hidden="true"><path d="M20 4h10l6 14-8 6z" fill="#1f5fbf"/><path d="M44 4H34l-6 14 8 6z" fill="#e0362c"/><circle cx="32" cy="40" r="18" fill="#f5b700"/><circle cx="32" cy="40" r="13" fill="none" stroke="#b07f00" stroke-width="3"/><path d="M32 31l2.8 5.8 6.3.9-4.6 4.4 1.1 6.2L32 45.3l-5.6 3 1.1-6.2-4.6-4.4 6.3-.9z" fill="#b07f00"/></svg>
    <div class="pz-txt"><div class="pz-k">Champions win</div><div class="pz-v"><b>$100</b> + medal</div></div>
    <svg class="medal" viewBox="0 0 64 64" aria-hidden="true"><path d="M20 4h10l6 14-8 6z" fill="#2e9e4f"/><path d="M44 4H34l-6 14 8 6z" fill="#7a3bb8"/><circle cx="32" cy="40" r="18" fill="#f5b700"/><circle cx="32" cy="40" r="13" fill="none" stroke="#b07f00" stroke-width="3"/><path d="M32 31l2.8 5.8 6.3.9-4.6 4.4 1.1 6.2L32 45.3l-5.6 3 1.1-6.2-4.6-4.4 6.3-.9z" fill="#b07f00"/></svg>
  </div>
  <div class="teams" id="teams"></div>
  <div class="foot">
    <div><div class="live">Scores and Golden Boot live</div><div class="url">luisgcode.github.io/fcc-cup</div></div>
    <div class="fmt">20 players<br>Semis, final and 3rd place</div>
  </div>
</div>
<div class="stripe b"></div>
<script>
var T=[['Goal Diggers','#1f5fbf',['Taha','James','Diluvan','Atif Mahmud','Sam']],['Winners FC','#2e9e4f',['Fuad','Babur','Shiby','Henry','Serg']],['FlipAll United','#e0362c',['Saim','Irfan','Altamash','Jay','Mauro']],['Ballers FC','#7a3bb8',['Raman','John','Arun Paul','Ahmed','Luis']]];
document.getElementById('teams').innerHTML=T.map(function(t){return '<div class="team"><div class="th" style="background:'+t[1]+'">'+t[0]+'<small>5 players</small></div><ol>'+t[2].map(function(p,i){return '<li><i>'+(i+1)+'</i>'+p+(i===0?'<span class="cap">CAPT</span>':'')+'</li>'}).join('')+'</ol></div>'}).join('');
</script>
</body></html>
